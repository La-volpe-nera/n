name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          set -o pipefail
          yes | sdkmanager --licenses > /dev/null || true

      - name: Inspect project structure
        run: |
          ls -la
          if [ -f settings.gradle ]; then echo "--- settings.gradle ---"; cat settings.gradle; fi
          if [ -f settings.gradle.kts ]; then echo "--- settings.gradle.kts ---"; cat settings.gradle.kts; fi
          echo "--- build.gradle (top 25 lines) ---"
          head -n 25 build.gradle || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomade-comms-debug-apk
          path: app/build/outputs/apk/debug/*.apk
