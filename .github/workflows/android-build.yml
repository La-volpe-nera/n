name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check Gradle files
        run: |
          echo "=== ROOT FILES ==="
          ls -la
          echo "=== settings.gradle ==="
          cat settings.gradle 2>/dev/null || echo "NAO EXISTE"
          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts 2>/dev/null || echo "NAO EXISTE"
          echo "=== root build.gradle ==="
          cat build.gradle 2>/dev/null || echo "NAO EXISTE"
          echo "=== app/build.gradle ==="
          cat app/build.gradle 2>/dev/null || echo "NAO EXISTE"
          echo "=== app/build.gradle.kts ==="
          cat app/build.gradle.kts 2>/dev/null || echo "NAO EXISTE"
